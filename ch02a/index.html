<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../theme.js"></script>
<title>机械制造技术 · 第二章 · 上</title>
<link rel="stylesheet" href="../reader/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d0202a'/%3E%3Cpath d='M9 23l4-9 4 9' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 14h8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<header id="bar">
  <div class="brand">
    <span class="mark">机</span>
    <span class="titles">
      <strong id="deckTitle">机械制造技术</strong>
      <small id="deckSub">第二章 · 上 · 课件</small>
    </span>
  </div>
  <div class="tools">
    <a class="tool course-home" href="../index.html" title="返回全部章节" aria-label="返回全部章节"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h14V9M10 20v-7h4v7"/></svg><span>课程</span></a>
    <button class="tool" id="btnSearch" title="搜索文字（/）" aria-label="搜索文字">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span>搜索</span>
    </button>
    <button class="tool" id="btnNotes" title="显示本页文字（T）" aria-label="显示本页文字">
      <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
      <span>文字</span>
    </button>
    <button class="tool" id="btnGrid" title="全部缩略图（G）" aria-label="全部缩略图">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/></svg>
      <span>目录</span>
    </button>
    <button class="tool" id="btnFull" title="全屏（F）" aria-label="全屏">
      <svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
      <span>全屏</span>
    </button>
    <button class="tool" id="btnTheme" aria-label="切换主题"></button>
  </div>
</header>

<main id="stageWrap">
  <div id="stage">
    <img id="slideImg" alt="" draggable="false">
    <div id="ovl"></div>
    <div id="caps"></div>
  </div>
  <div id="loadFeedback" hidden><span role="status" id="loadMessage"></span><button id="retryPage" hidden>重新加载本页</button></div>
  <span class="gif-badge" id="gifBadge" hidden></span>
  <button class="tool fit-button" id="btnFit" title="恢复整页适应" aria-label="恢复整页适应">恢复适应</button>
  <div class="pager">

    <button id="btnPrev" aria-label="上一页"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <form id="pageForm"><label id="counter"><input id="pageInput" type="text" inputmode="numeric" pattern="[0-9]+" aria-label="跳转页码" value="1"> / <span id="pageTotal">32</span></label></form>
    <button id="btnNext" aria-label="下一页"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</main>

<footer id="foot">
  <div id="progress"><i></i></div>
</footer>

<!-- 目录 -->
<section id="grid" class="overlay" hidden role="dialog" aria-modal="true" aria-label="幻灯片目录">
  <div class="panel">
    <div class="panel-head">
      <h2>目录<span id="gridCount"></span></h2>
      <button class="close" aria-label="关闭">&times;</button>
    </div>
    <div class="grid-body" id="gridBody"></div>
  </div>
</section>

<!-- 搜索 -->
<section id="search" class="overlay" hidden role="dialog" aria-modal="true" aria-label="搜索">
  <div class="panel narrow">
    <div class="panel-head">
      <h2>搜索课件文字</h2>
      <button class="close" aria-label="关闭">&times;</button>
    </div>
    <div class="search-body">
      <input id="searchInput" type="search" placeholder="输入关键词，例如：刀具、切削、误差…" autocomplete="off">
      <div id="searchResults" class="results"></div>
    </div>
  </div>
</section>

<!-- 本页文字 -->
<aside id="notes" class="drawer" hidden aria-label="本页文字">
  <div class="panel-head">
    <h2>本页文字</h2>
    <button class="close" aria-label="关闭">&times;</button>
  </div>
  <div class="notes-body">
    <h3 id="notesTitle"></h3>
    <pre id="notesText"></pre>
    <p class="notes-hint">文字可直接选中复制；含动图的页面在文字下方标注。</p>
  </div>
</aside>

<div id="toast" role="status" aria-live="polite"></div>

<script src="assets/deck-data.js"></script>
<script src="../reader/page-buffer.js"></script>
<script src="../reader/app.js"></script>
</body>
</html>
